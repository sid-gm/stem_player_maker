function Matchmaker({ data, song, swaps, setSwaps, onClose, flash }) {
  const [phase, setPhase] = useState("add");     // add | analyzing | results
  const [source, setSource] = useState("kit");
  const [dropped, setDropped] = useState(null);  // { name, file, rawBuf } — the dry sound
  const [recs, setRecs] = useState(null);
  const [soundLen, setSoundLen] = useState(0);
  const fileRef = useRef(null);
  const rec = useRecorder((f) => onDrop(f));
  const player = useMatchPreview(dropped, song, flash);
  const matched = recs ? recs.filter((r) => swaps[r.label]).length : Object.keys(swaps).length;

  const runMatch = async (d) => {
    setPhase("analyzing"); setRecs(null);
    try {
      // dry, untrimmed wav so the ranking reflects the sound itself
      const file = await bakeSwapFile({ rawBuf: d.rawBuf, fx: [], name: d.name, file: d.file });
      const [info] = await Promise.all([matchSound(song, file), new Promise((r) => setTimeout(r, 1400))]);
      setRecs(info.recommendations || []);
      setSoundLen(info.sound_len_sec || (d.rawBuf ? d.rawBuf.duration : 1));
      setPhase("results");
    } catch (e) { flash("matchmaker: " + e.message, true); setPhase("add"); }
  };
  const onDrop = async (file) => {
    let rawBuf = null;
    try { rawBuf = await decodeFile(file); } catch (e) { flash("can't preview this format — will match raw", true); }
    const d = { name: file.name, file, rawBuf }; setDropped(d); runMatch(d);
  };
  const onKit = async (snd) => {
    let rawBuf = null;
    try { rawBuf = await fetchDecode(kitUrl(snd.file), "default"); }
    catch (e) { flash("couldn't load that sound", true); return; }
    const d = { name: snd.name + ".wav", file: null, rawBuf }; setDropped(d); runMatch(d);
  };
  const pickUpload = () => fileRef.current && fileRef.current.click();

  // confirm/unconfirm a part → a normal swap whose trim = this part's best-fit sub-region
  const toggle = async (r) => {
    const label = r.label;
    if (swaps[label]) { setSwaps((m) => { const n = { ...m }; delete n[label]; return n; }); return; }
    const part = partOf(data, label); const cap = partMaxLen(part);
    const off = r.best_offset;
    const maxEnd = dropped && dropped.rawBuf ? dropped.rawBuf.duration : off.end_sec;
    const trim = { start: off.start_sec, end: Math.min(off.end_sec, off.start_sec + cap, maxEnd) };
    let file;
    try { file = await bakeSwapFile({ rawBuf: dropped.rawBuf, fx: [], trim, name: dropped.name, file: dropped.file }); }
    catch (e) { flash("couldn't prep that sound", true); return; }
    setSwaps((m) => ({ ...m, [label]: { stem: r.stem, fx: [], name: dropped.name, file, rawBuf: dropped.rawBuf, trim } }));
    flash(`matched ${label} · fills ×${r.count}`);
  };
  const close = () => { player.stop(); onClose(); };
  const replay = () => { player.stop(); setDropped(null); setRecs(null); setSource("kit"); setPhase("add"); };

  const best = recs ? recs.filter((r) => r.tier === "best") : [];
  const worst = recs ? recs.filter((r) => r.tier === "worst") : [];

  return (
    <div className="scrim" onClick={close}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <span className="grab" />

        {phase === "add" && (
          <React.Fragment>
            <div className="shead">
              <div style={{ flex: 1 }}><div className="st">matchmaker</div><div className="ss">drop a sound · we find its spot</div></div>
              <IconButton size="sm" aria-label="close" onClick={close}>✕</IconButton>
            </div>
            <input ref={fileRef} type="file" accept="audio/*,.mp3,.wav,.m4a" style={{ display: "none" }}
              onChange={(e) => { const f = e.target.files[0]; if (f) onDrop(f); }} />
            <MMAdd source={source} setSource={setSource} onKit={onKit} rec={rec} pickUpload={pickUpload} flash={flash} />
          </React.Fragment>
        )}

        {phase === "analyzing" && <Analyzing soundName={dropped ? dropped.name : ""} soundLen={dropped && dropped.rawBuf ? dropped.rawBuf.duration : 0} />}

        {phase === "results" && recs && (
          <React.Fragment>
            <div className="shead">
              <div style={{ flex: 1 }}><div className="st">matchmaker</div><div className="ss">where does it fit?</div></div>
              <IconButton size="sm" aria-label="close" onClick={close}>✕</IconButton>
            </div>
            <div className="mm-snd">
              <PlayDot on={player.isOn("src", "snd")} title="hear the whole sound" onClick={() => player.play("src", "snd", { off: [0, soundLen] })} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="nm">🎚 {dropped.name}</div>
                <div style={{ marginTop: 6 }}><MiniTrim off={[0, soundLen]} len={soundLen} count={54} height={22} progress={player.at("src", "snd")} /></div>
                <div className="mt">{soundLen.toFixed(1)}s · your sound</div>
              </div>
              <button className="mm-replay" onClick={replay}>↺ new sound</button>
            </div>

            {recs.length === 0 && <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-3)", textAlign: "center", padding: 10 }}>no parts to rank.</div>}
            {recs.length > 0 && (
              <React.Fragment>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                  <span className="lbl">{recs.length} parts ranked by fit</span><span style={{ flex: 1 }} />
                  <span className="lbl" style={{ color: matched ? "var(--success)" : "var(--ink-3)" }}>{matched ? "✓ " + matched + " matched" : "match any you like"}</span>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
                  {best.map((r) => <MMRow key={r.label} r={r} player={player} on={!!swaps[r.label]} onToggle={toggle} soundLen={soundLen} />)}
                  {worst.length > 0 && <MMDivider label="💀 worst fit · for the memes" color="var(--danger)" />}
                  {worst.map((r) => <MMRow key={r.label} r={r} player={player} on={!!swaps[r.label]} onToggle={toggle} soundLen={soundLen} />)}
                </div>
              </React.Fragment>
            )}

            <Button block size="lg" disabled={!matched} onClick={close} style={{ marginTop: 2 }}>
              {matched ? ("done · " + matched + " swap" + (matched > 1 ? "s" : "") + " → timeline") : "match a part to swap"}</Button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------ Finalize (review + export) */
function Finalize({ data, song, swaps, setSwaps, setStep, flash, bounce, setBounce, mix, setMix }) {
  const ab = mix, setAb = setMix;                   // A/B choice is shared with the studio toggle
  const [prog, setProg] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [status, setStatus] = useState("");
  const [exporting, setExporting] = useState(false);
  const dur = data.duration_sec || 1;
  const entries = Object.entries(swaps);
  const sig = sigOf(swaps);
  const ready = !!(bounce && bounce.sig === sig && Eng.editedBuffers);  // render matches current swaps

  useEffect(() => { Eng.onTick = (t, d) => setProg(d ? t / d : 0); Eng.onState = setPlaying; return () => { Eng.onTick = null; Eng.onState = null; }; }, []);

  // Make the remix playable for the current swaps — reuse the studio's local splice if it
  // matches, otherwise build it now (instant, no Modal). The server bounce is reserved for
  // the export tap below.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      engPause();
      if (!entries.length) { Eng.editedBuffers = null; Eng.buffers = { ...(Eng.origBuffers || {}) }; setBounce(null); setStatus("no swaps yet — go back and replace a part"); return; }
      if (ready) { Eng.buffers = ab === "remix" ? Eng.editedBuffers : { ...(Eng.origBuffers || {}) }; setStatus(`ready — ${bounce.slots_replaced} slots across the ${Math.round(bounce.duration_sec)}s song ▶`); return; }
      try {
        const info = await previewMedley(data, song, swaps);
        if (cancelled) return;
        setBounce(info); Eng.buffers = ab === "remix" ? Eng.editedBuffers : { ...(Eng.origBuffers || {}) };
        setStatus(`ready — ${info.slots_replaced} slots across the ${Math.round(info.duration_sec)}s song ▶`);
      } catch (e) { if (!cancelled) { setStatus("preview failed: " + e.message); flash(e.message, true); } }
    })();
    return () => { cancelled = true; };
  }, [sig]);

  // flip the active buffer set on A/B without re-rendering
  useEffect(() => {
    if (!Eng.editedBuffers) return;
    Eng.buffers = ab === "remix" ? Eng.editedBuffers : { ...(Eng.origBuffers || {}) };
    if (Eng.playing) { const o = Eng.offset + (engNow() - Eng.ctxStart); engPause(); Eng.offset = o; engPlay(); }
  }, [ab]);

  const isRemix = ab === "remix";
  const revert = (label) => setSwaps((m) => { const n = { ...m }; delete n[label]; return n; });
  const download = (paths) => { const rel = paths.mp3 || paths.wav; const a = document.createElement("a"); a.href = asset(rel); a.download = (data.song_id || song) + "-jawn." + (rel.split(".").pop()); a.click(); };
  // The one Modal round-trip in the flow: bounce the final mix on the server, then download.
  // Reuses a prior server bounce if it already matches these exact swaps.
  const exportJawn = async () => {
    if (!entries.length || exporting) return;
    if (bounce && bounce.paths && bounce.sig === sig) { download(bounce.paths); return; }
    setExporting(true);
    try {
      const info = await renderMedley(song, swaps, setStatus);   // server bounce; leaves the local preview buffers intact
      setBounce(info); setStatus(`exported — ${info.slots_replaced} slots`);
      download(info.paths);
    } catch (e) { setStatus("export failed: " + e.message); flash(e.message, true); }
    setExporting(false);
  };

  return (
    <div className="scr" style={{ padding: "16px 18px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <IconButton size="sm" aria-label="back" onClick={() => { engPause(); Eng.buffers = { ...(Eng.origBuffers || {}) }; setStep("studio"); }}>‹</IconButton>
        <div><div className="eyebrow">finalize · the whole jawn</div></div>
      </div>
      <div className="bigtitle" style={{ fontSize: 32, margin: "8px 0 14px" }}>{entries.length ? "your jawn" : "finalize"}</div>

      <div style={{ background: "var(--surface)", borderRadius: "var(--r-xl)", padding: 15, boxShadow: "inset 0 0 0 1px var(--stem-bass)", display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div className="bigtitle" style={{ fontSize: 17, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.song_id || song}</div>
          <div className="ab">
            <button className={!isRemix ? "on" : ""} onClick={() => setAb("orig")}>original</button>
            <button className={isRemix ? "on" : ""} onClick={() => setAb("remix")} disabled={!entries.length}>your jawn</button>
          </div>
        </div>
        <Scrub onSeek={(f) => engSeek(f * dur)}><Waveform seed={(isRemix ? "remix" + sig : "orig") + song} count={54} height={46} color={isRemix ? "var(--brand)" : "var(--ink-3)"} progress={prog} /></Scrub>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <IconButton size="md" aria-label="restart" onClick={() => engSeek(0)}>⟲</IconButton>
          <IconButton variant="brand" size="lg" active={playing} aria-label="play" onClick={() => (playing ? engPause() : engPlay())}>{playing ? "⏸" : "▶"}</IconButton>
          <div className="xtime">{fmt(prog * dur)} <span>/ {fmt(dur)}</span></div>
          <div style={{ flex: 1 }} />
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: isRemix ? "var(--brand)" : "var(--ink-3)" }}>{isRemix ? "🎚 " + entries.length + " live" : "untouched"}</span>
        </div>
      </div>

      <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-3)", margin: "10px 2px 0" }}>{status}</div>

      <div className="eyebrow" style={{ margin: "16px 2px 9px" }}>changes in this mix</div>
      <div style={{ flex: "1 1 0", minHeight: 0, overflowY: "auto", display: "flex", flexDirection: "column", gap: 7 }}>
        {entries.length === 0 && <div style={{ color: "var(--ink-3)", fontFamily: "var(--font-mono)", fontSize: 12, padding: "8px 2px" }}>no swaps yet — go back and replace a part.</div>}
        {entries.map(([label, v]) => (
          <div className="lrow" key={label}>
            <StemTag stem={v.stem} label={label} count={partOf(data, label).occurrence_count} />
            <span style={{ color: "var(--ink-3)" }}>→</span>
            <span className="fn" style={{ flex: 1 }}>🎚 {v.name}</span>
            <span className="fxm">{v.fx.map((id) => FX[id].e).join(" ") || "raw"}</span>
            <button className="rv" aria-label="revert" onClick={() => revert(label)}>↩</button>
          </div>
        ))}
      </div>

      <div className="xport" style={{ margin: "8px -18px 0" }}>
        <div style={{ display: "flex", gap: 10 }}>
          <Button block size="lg" variant="ghost" onClick={() => { engPause(); Eng.buffers = { ...(Eng.origBuffers || {}) }; setStep("studio"); }}>‹ keep editing</Button>
          <Button block size="lg" disabled={!ready || exporting} onClick={exportJawn}>{exporting ? "bouncing…" : "export jawn →"}</Button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
